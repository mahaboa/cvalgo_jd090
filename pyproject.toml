[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mahaboa-cvalgo_jd090"
version = "0.1.0"
description = "把输入按语义边界切成独立单元，逐单元核对计算机视觉算法工程师·函数调用的 schema 校验相关的特征并标出命中位置"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "mahaboa" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://mahaboa.github.io"
Repository = "https://github.com/mahaboa/cvalgo_jd090"
Issues = "https://github.com/mahaboa/cvalgo_jd090/issues"

[project.scripts]
cvalgo_jd090 = "cvalgo_jd090:main"

[tool.setuptools]
py-modules = ["cvalgo_jd090"]
